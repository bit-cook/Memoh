name: Contribution format compatibility
on:
  workflow_call:
permissions:
  contents: read
jobs:
  check:
    name: Contribution format
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      # 兼容仍引用此工作流的旧 PR；默认分支入口不再阻断代码 CI。
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/github-script@v7
        with:
          retries: 3
          script: |
            const { gate } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/contribution-governance.mjs`);
            await gate({ github, context, core });
