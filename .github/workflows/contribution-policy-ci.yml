name: Contribution policy CI
on:
  pull_request:
    paths: ['.github/**', 'CONTRIBUTING.md', 'AGENTS.md']
  push:
    branches: [main]
    paths: ['.github/**', 'CONTRIBUTING.md', 'AGENTS.md']
permissions:
  contents: read
  statuses: read
  pull-requests: read
jobs:
  format:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/contribution-format.yml
  test:
    needs: format
    if: always() && !cancelled() && (github.event_name != 'pull_request' || needs.format.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test .github/scripts/*.test.mjs
